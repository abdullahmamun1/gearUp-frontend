<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fdfcf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130e0a" media="(prefers-color-scheme: dark)" />
    <title>You're offline · GearUp</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <!-- Served by the service worker with no network: everything is inline. -->
    <style>
      :root {
        --bg: #fdfcf9;
        --fg: #1b150f;
        --muted: #6a615b;
        --pine: #0b764d;
        --tint: #0b764d1a;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #130e0a;
          --fg: #f5f2ec;
          --muted: #a69d95;
          --pine: #4cc38a;
          --tint: #4cc38a24;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; display: grid; justify-items: center; gap: 16px; }
      .mark {
        width: 64px; height: 64px; border-radius: 18px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #0b764d, #0071a5);
      }
      h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); font-size: 0.9rem; }
      button {
        font: inherit; font-weight: 600; font-size: 0.9rem;
        border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
        background: var(--pine); color: #fff;
      }
      button:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f4fdf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z" /></svg>
      </div>
      <h1>You're offline</h1>
      <p>GearUp needs a connection to show gear, bookings and payments. Check your signal or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself once the connection is back.
      addEventListener("online", () => location.reload())
    </script>
  </body>
</html>
